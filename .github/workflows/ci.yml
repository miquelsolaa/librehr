name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: no job in this workflow writes to the repository.
permissions:
  contents: read

jobs:
  commits:
    # DCO sign-off and Conventional Commits are also enforced by local husky
    # hooks, but hooks can be skipped; this job is the authoritative check.
    name: Commit Hygiene (DCO + commitlint)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check DCO sign-off on every commit
        # The author must sign off with their own email: a Signed-off-by line
        # for someone else does not certify the author's contribution.
        # Commit data is untrusted; it is only compared, never evaluated.
        shell: bash
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}"); do
            author_email="$(git log -1 --format='%ae' "$sha" | tr '[:upper:]' '[:lower:]')"
            signed=0
            while IFS= read -r value; do
              # "Name <email>": take the address between the last < and >.
              email="$(printf '%s' "$value" | sed -n 's/.*<\([^<>]*\)>[[:space:]]*$/\1/p' | tr '[:upper:]' '[:lower:]')"
              if [ -n "$email" ] && [ "$email" = "$author_email" ]; then
                signed=1
              fi
            done < <(git log -1 --format='%(trailers:key=Signed-off-by,valueonly,unfold)' "$sha")
            if [ "$signed" -ne 1 ]; then
              echo "::error::Commit ${sha} has no 'Signed-off-by:' trailer matching its author email. Use 'git commit -s' with the author identity (see CONTRIBUTING.md)."
              missing=1
            fi
          done
          exit "$missing"

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint commit messages
        run: pnpm exec commitlint --from "${BASE_SHA}" --to "${HEAD_SHA}" --verbose

  community:
    # LIC-002: a build with ee/ deleted must still work as the Community
    # edition. Unit tests only; the Verify job runs everything with ee/.
    name: Community build without ee/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Remove the Business edition
        run: rm -rf ee

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit Tests
        run: pnpm test

      - name: Build Packages & Apps
        run: pnpm turbo run build

  verify:
    name: Verify (Typecheck, Lint, Tests, Build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # Bootstrap superuser, deliberately not librehr_owner: the test helper
          # creates librehr_owner (NOSUPERUSER NOBYPASSRLS) to run migrations, as in production.
          POSTGRES_USER: librehr_bootstrap
          POSTGRES_PASSWORD: librehr_test_password
          POSTGRES_DB: librehr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U librehr_bootstrap -d librehr_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_TEST_URL: postgres://librehr_bootstrap:librehr_test_password@localhost:5432/librehr_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit Tests & Invariant Property Tests
        run: pnpm test

      - name: Import Boundary Lint Test
        run: pnpm --filter @librehr/config test

      - name: Integration Tests
        env:
          DATABASE_TEST_URL: postgres://librehr_bootstrap:librehr_test_password@localhost:5432/librehr_test
        run: pnpm test:int

      - name: i18n Consistency Check
        run: pnpm i18n:check

      - name: Build Packages & Apps
        run: pnpm turbo run build

      - name: Playwright E2E Tests
        run: |
          pnpm --filter web exec playwright install --with-deps chromium
          pnpm --filter web test:e2e
