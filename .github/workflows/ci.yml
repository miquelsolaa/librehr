name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Typecheck, Lint, Tests, Build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: librehr_owner
          POSTGRES_PASSWORD: librehr_test_password
          POSTGRES_DB: librehr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U librehr_owner -d librehr_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_TEST_URL: postgres://librehr_owner:librehr_test_password@localhost:5432/librehr_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit Tests & Invariant Property Tests
        run: pnpm test

      - name: Import Boundary Lint Test
        run: pnpm --filter @librehr/config test

      - name: Integration Tests
        env:
          DATABASE_TEST_URL: postgres://librehr_owner:librehr_test_password@localhost:5432/librehr_test
        run: pnpm test:int

      - name: i18n Consistency Check
        run: pnpm i18n:check

      - name: Build Packages & Apps
        run: pnpm turbo run build

      - name: Playwright E2E Tests
        run: |
          pnpm --filter web exec playwright install --with-deps chromium
          pnpm --filter web test:e2e
