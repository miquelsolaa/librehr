name: Bug Report
description: Report a reproducible bug in OpenHR
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please do not report security vulnerabilities here (see SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: input
    id: prd_reference
    attributes:
      label: Related PRD Requirement ID
      description: E.g. TIM-001, LEA-004 (if known)
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide step-by-step reproduction instructions.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen according to PRD / Spanish labour regulation?
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Docker Compose (local)
        - Self-hosted Bare Metal / VM
        - Development (pnpm dev)
    validations:
      required: true
