packages:
  - 'apps/*'
  - 'packages/*'
  - 'ee/*'
allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  cpu-features: false
  esbuild: true
  protobufjs: true
  sharp: true
  ssh2: false
overrides:
  # GHSA-3g3m-2fjr-6pw4: glob <=14.0.1 lets AbortSignal timeouts leak into
  # further traversal. Storybook's docgen plugin pins glob ^13; drop this once
  # @storybook/react-vite depends on a plugin release without it.
  "@joshwooding/vite-plugin-react-docgen-typescript>glob": 14.0.3
