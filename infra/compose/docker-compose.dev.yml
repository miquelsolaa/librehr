services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: librehr
      POSTGRES_USER: librehr
      POSTGRES_PASSWORD: librehr_dev_password
    volumes:
      - librehr_dev_pgdata:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U librehr -d librehr"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 500

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: librehr_minio_user
      MINIO_ROOT_PASSWORD: librehr_minio_password
    volumes:
      - librehr_dev_miniodata:/data

volumes:
  librehr_dev_pgdata:
  librehr_dev_miniodata:
